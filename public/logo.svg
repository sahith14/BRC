<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="BRC — Bharata Rashtra Cockroaches Party">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffd3e1"/>
      <stop offset="55%" stop-color="#ffb3cf"/>
      <stop offset="100%" stop-color="#ec1071"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="podium" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff5fa"/>
      <stop offset="100%" stop-color="#ffd1e3"/>
    </linearGradient>
    <radialGradient id="roach" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8a4a25"/>
      <stop offset="55%" stop-color="#4f2a13"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </radialGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="300" cy="300" r="295" fill="#ec1071"/>
  <circle cx="300" cy="300" r="278" fill="url(#bg)"/>

  <!-- Sun rays -->
  <g opacity="0.35">
    <g fill="#ec1071">
      <polygon points="300,80 320,260 280,260"/>
      <polygon points="120,170 290,265 270,290"/>
      <polygon points="480,170 310,265 330,290"/>
      <polygon points="80,300 270,290 270,310"/>
      <polygon points="520,300 330,290 330,310"/>
    </g>
  </g>
  <circle cx="300" cy="300" r="170" fill="url(#sun)"/>

  <!-- Crowd silhouette -->
  <g fill="#7d0f48" opacity="0.65">
    <rect x="60" y="350" width="20" height="60" rx="6"/>
    <rect x="90" y="330" width="22" height="80" rx="6"/>
    <rect x="125" y="345" width="20" height="65" rx="6"/>
    <rect x="155" y="325" width="22" height="85" rx="6"/>
    <rect x="190" y="340" width="20" height="70" rx="6"/>
    <rect x="220" y="335" width="24" height="75" rx="6"/>
    <rect x="360" y="340" width="22" height="70" rx="6"/>
    <rect x="395" y="325" width="22" height="85" rx="6"/>
    <rect x="430" y="345" width="20" height="65" rx="6"/>
    <rect x="460" y="335" width="24" height="75" rx="6"/>
    <rect x="495" y="345" width="20" height="65" rx="6"/>
    <rect x="525" y="350" width="20" height="60" rx="6"/>
  </g>

  <!-- Crop / wheat -->
  <g fill="#7d0f48" opacity="0.55">
    <path d="M70 360 Q78 320 86 360 Z"/>
    <path d="M86 360 Q94 320 102 360 Z"/>
    <path d="M508 360 Q516 320 524 360 Z"/>
    <path d="M524 360 Q532 320 540 360 Z"/>
  </g>

  <!-- Tiny flags -->
  <g fill="#ec1071">
    <rect x="98" y="290" width="2" height="35"/>
    <polygon points="100,290 120,295 100,300"/>
    <rect x="200" y="285" width="2" height="40"/>
    <polygon points="202,285 222,290 202,295"/>
    <rect x="430" y="288" width="2" height="38"/>
    <polygon points="432,288 452,293 432,298"/>
  </g>

  <!-- Cockroach: shadow -->
  <ellipse cx="300" cy="335" rx="120" ry="14" fill="#7d0f48" opacity="0.45"/>

  <!-- Antennae -->
  <path d="M270 175 C235 130 200 130 180 150" stroke="#2a1408" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M330 175 C365 130 400 130 420 150" stroke="#2a1408" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Legs -->
  <g stroke="#2a1408" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M250 250 L195 240"/>
    <path d="M250 280 L180 290"/>
    <path d="M255 315 L195 340"/>
    <path d="M350 250 L405 240"/>
    <path d="M350 280 L420 290"/>
    <path d="M345 315 L405 340"/>
  </g>

  <!-- Body -->
  <ellipse cx="300" cy="280" rx="85" ry="100" fill="url(#roach)" stroke="#1a0e06" stroke-width="2"/>
  <!-- Body segments -->
  <path d="M225 250 Q300 235 375 250" stroke="#1a0e06" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M225 290 Q300 280 375 290" stroke="#1a0e06" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M230 330 Q300 322 370 330" stroke="#1a0e06" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M300 200 L300 360" stroke="#1a0e06" stroke-width="2" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="300" cy="195" rx="50" ry="36" fill="url(#roach)" stroke="#1a0e06" stroke-width="2"/>

  <!-- Sunglasses -->
  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2">
    <rect x="262" y="185" width="32" height="18" rx="6"/>
    <rect x="306" y="185" width="32" height="18" rx="6"/>
    <line x1="294" y1="192" x2="306" y2="192" stroke="#0a0a0a" stroke-width="3"/>
  </g>
  <!-- glasses shine -->
  <rect x="268" y="188" width="8" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="312" y="188" width="8" height="4" rx="2" fill="#ffffff" opacity="0.4"/>

  <!-- Smile -->
  <path d="M280 215 Q300 225 320 215" stroke="#1a0e06" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Podium -->
  <g>
    <rect x="245" y="365" width="110" height="80" fill="url(#podium)" stroke="#ec1071" stroke-width="3"/>
    <circle cx="300" cy="400" r="22" fill="none" stroke="#ec1071" stroke-width="3"/>
    <path d="M291 392 Q300 400 295 412 M309 392 Q300 400 305 412" stroke="#ec1071" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Banner -->
  <g>
    <rect x="120" y="470" width="360" height="56" fill="#fff5fa" stroke="#ec1071" stroke-width="3"/>
    <text x="300" y="508" text-anchor="middle" font-family="Impact, Anton, sans-serif" font-size="40" fill="#3a0820" letter-spacing="2">COCKROACHES</text>
  </g>

  <!-- Top text -->
  <text x="300" y="445" text-anchor="middle" font-family="Impact, Anton, sans-serif" font-size="22" fill="#3a0820" letter-spacing="3">BHARATA RASHTRA</text>

  <!-- BRC pill -->
  <g>
    <rect x="262" y="538" width="76" height="26" rx="13" fill="#ec1071"/>
    <text x="300" y="557" text-anchor="middle" font-family="Impact, Anton, sans-serif" font-size="18" fill="#fff" letter-spacing="3">BRC</text>
  </g>
</svg>
